name: Audit Navier-Stokes

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Recuperer le depot OpenAI
        uses: actions/checkout@v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: f9e8bc5b38b6e212696e8a30e3e91517af887bbd

      - name: Installer elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compiler OpenAI
        shell: bash
        run: |
          set -euo pipefail
          cat lean-toolchain
          lean --version
          lake --version
          lake exe cache get
          lake build 2>&1 | tee lean-build.log

      - name: Conserver les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-lean
          path: lean-build.log
          if-no-files-found: warn
